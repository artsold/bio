<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:linear-gradient(180deg,#FF4B12 0%,#FF6B35 100%);font-family:'Nunito',sans-serif;position:relative;overflow:hidden}
.wrap{position:absolute;left:72px;top:70px;right:440px}
.pill{display:inline-flex;align-items:center;gap:12px;background:#1A1A2E;color:#fff;font-family:'DM Mono',monospace;font-size:20px;letter-spacing:.1em;text-transform:uppercase;padding:12px 22px 12px 16px;border-radius:999px;box-shadow:0 6px 0 rgba(26,26,46,.35)}
.pill i{width:14px;height:14px;border-radius:50%;background:#FFD700;display:block}
.name{font-family:'Lilita One';font-size:128px;line-height:.98;text-transform:uppercase;margin-top:34px;-webkit-text-stroke:.12em #1A1A2E;paint-order:stroke fill;text-shadow:0 .07em 0 #1A1A2E;letter-spacing:.01em}
.a{color:#fff}.b{color:#FFD700}
.role{font-weight:800;font-size:34px;color:#1A1A2E;margin-top:30px}
.tag{font-family:'DM Mono',monospace;font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:#1A1A2E;margin-top:14px}
.photo{position:absolute;right:70px;top:115px;width:330px;height:330px;border-radius:50%;padding:10px;border:3px dashed #FFD700}
.photo img{width:100%;height:100%;border-radius:50%;border:5px solid #1A1A2E;display:block;object-fit:cover}
.url{position:absolute;right:70px;bottom:52px;font-family:'Lilita One';font-size:40px;color:#fff;-webkit-text-stroke:.12em #1A1A2E;paint-order:stroke fill;text-shadow:0 .07em 0 #1A1A2E;letter-spacing:.01em}
</style></head><body>
<div class="wrap"><div class="pill"><i></i>Open to UA Creative / Motion roles · Remote</div>
<div class="name"><div class="a">Artiom</div><div class="b">Soldatov</div></div>
<div class="role">Motion Designer &amp; AI Creative Producer</div>
<div class="tag">Video ads built on AI pipelines</div></div>
<div class="photo"><img src="photo.jpg"></div>
<div class="url">souldatov.com</div>
</body></html>
