<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>*{margin:0}body{width:512px;height:512px;background:transparent}
.i{width:512px;height:512px;border-radius:112px;background:#FF4B12;display:grid;place-items:center;box-shadow:inset 0 -36px 0 #D93A08}
.t{font-family:'Lilita One';font-size:300px;line-height:1;margin-top:-30px;-webkit-text-stroke:52px #1A1A2E;paint-order:stroke fill;letter-spacing:-.02em}
.t .a{color:#fff}.t .b{color:#FFD700}</style></head><body><div class="i"><div class="t"><span class="a">A</span><span class="b">S</span></div></div></body></html>
